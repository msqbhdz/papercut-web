<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#BE2428">
  <meta name="description" content="在红纸上用金笔画一笔，点完成让它扇形甩开，变成红盘白刻线的剪纸窗花。纯前端、可离线使用。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="剪纸">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>剪纸窗花 · Papercut</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./style.v2.css">
</head>
<body data-mode="folded">
  <header class="topbar">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span>剪纸窗花</h1>
    <div id="foldGroup" class="segmented" role="group" aria-label="折叠份数">
      <button type="button" data-fold="4" aria-pressed="false">四角</button>
      <button type="button" data-fold="6" class="is-active" aria-pressed="true">六角</button>
      <button type="button" data-fold="8" aria-pressed="false">八角</button>
    </div>
    <button id="install" class="btn btn-chip" type="button" hidden><span class="chip-ico" aria-hidden="true"></span><span class="install-label">安装到桌面</span></button>
  </header>

  <main class="stage-wrap">
    <div id="stage">
      <canvas id="board" aria-label="剪纸画板，请在红纸上落笔">你的浏览器不支持 canvas。</canvas>
    </div>
    <div id="hint" class="hint">在红纸上落笔<br>点「完成」让窗花甩开</div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <footer class="toolbar">
    <div class="controls controls-fold">
      <label class="brush">
        <span class="brush-label">笔宽</span>
        <input id="brushSize" type="range" min="0" max="100" step="1" value="25" aria-label="笔画粗细">
      </label>
      <button id="undo" class="btn" type="button" disabled>撤销</button>
      <button id="redo" class="btn" type="button" disabled>重做</button>
      <button id="clear" class="btn" type="button" disabled>清空</button>
      <button id="finish" class="btn btn-primary" type="button" disabled>完成</button>
    </div>

    <div class="controls controls-final">
      <button id="restart" class="btn" type="button">继续画</button>
      <button id="exportPng" class="btn btn-primary" type="button">保存 PNG</button>
      <button id="exportSvg" class="btn btn-outline" type="button">保存 SVG</button>
    </div>
  </footer>

  <div id="boot" class="boot">
    <div class="boot-card" role="alertdialog" aria-modal="true" aria-labelledby="bootTitle">
      <h2 id="bootTitle">需要用本地服务器打开</h2>
      <p>双击打开时地址栏是 <code>file://</code>，浏览器会拦截 ES 模块，页面因此没能启动。</p>
      <ol class="boot-steps">
        <li>在 VSCode 里右键 <code>index.html</code>，选「Open with Live Server」，它会开在端口 5500。</li>
        <li>或在项目目录自己起一个静态服务器，让它监听同一个 5500 端口，再访问 <code>localhost:5500</code>。</li>
      </ol>
      <button class="btn btn-primary" type="button" data-boot-close>知道了</button>
    </div>
  </div>

  <noscript>
    <div class="boot is-on">
      <div class="boot-card">
        <h2>需要 JavaScript</h2>
        <p>本应用全部在浏览器本地运行，请允许 JavaScript 后重新加载。</p>
      </div>
    </div>
  </noscript>

  <script>
    (function () {
      var boot = document.getElementById('boot');
      var timer = window.setTimeout(function () {
        if (!window.__papercutBooted) boot.classList.add('is-on');
      }, 1500);
      boot.addEventListener('click', function (event) {
        if (event.target.closest && event.target.closest('[data-boot-close]')) {
          window.clearTimeout(timer);
          boot.classList.remove('is-on');
        }
      });
      if (window.__papercutBooted) window.clearTimeout(timer);
    })();
  </script>
  <script type="module" src="./js/main.v2.js"></script>
</body>
</html>
